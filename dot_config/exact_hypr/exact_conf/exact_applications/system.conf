# Floating windows
windowrule = float on, center on, size 875 600, match:tag floating-window

windowrule = tag +floating-window, match:class (org.gnome.NautilusPreviewer|org.gnome.Evince|imv|mpv|viewnior)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*|.*[I|i]mport.*|blob:.*)
windowrule = float on, match:class org.gnome.Calculator
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(qalculate-gtk)$

# No transparency on media windows
windowrule = opacity 1 1, match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|imv|org.gnome.NautilusPreviewer|viewnior)$

# Popped window rounding
windowrule = rounding 8, match:tag pop