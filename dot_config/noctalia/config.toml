[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "hyprland", "qt" ]
community_ids = [ "pywalfox-beta4", "steam", "spicetify", "hyprtoolkit" ]

[config]

[control_center.calendar]
show_week_numbers = true

[location]
address = "Leeuwarden, The Netherlands"

[osd]
position = "top_right"

[shell]
lang = "en"

[shell.greeter_sync]
auto_sync = true

[shell.panel]
open_near_click_control_center = true
open_near_click_wallpaper = true
session_placement = "floating"
session_position = "center"

[wallpaper]
directory = "/home/pieter/Pictures/Wallpapers"

[wallpaper.automation]
enabled = false

[desktop_widgets]
enabled = false

[bar.default]
concave_edge_corners = false
end = [
    "tray",
    "bluetooth",
    "network",
    "spacer_default",
    "volume",
    "input_volume",
    "spacer_default",
    "group:wallpaper",
    "power_profile",
    "group:system_monitoring",
    "battery",
    "notifications",
    "control-center"
]
margin_edge = 5
margin_ends = 10
scale = 1
start = [ "taskbar", "spacer_default", "media" ]
thickness = 36
capsule = true
background_opacity = 0.8

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_container"
id = "system_monitoring"
members = [ "cpu", "temp", "ram" ]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = true
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "wallpaper"
members = [ "wallpaper", "wallpaper_depth", "wallhaven" ]
opacity = 1.0
padding = 6.0

[widget.battery]
capsule = true
display_mode = "graphic"
show_label = true

[widget.bluetooth]
capsule = true

[widget.clock]
capsule = true
format = "{:%H:%M}, {:%d %b}"

[widget.control-center]
glyph = "adjustments"
capsule = true

[widget.cpu]
show_value = false

[widget.input_volume]
capsule = true

[widget.media]
capsule = true
hide_when_no_media = true

[widget.network]
capsule = true
show_label = false

[widget.power_profile]
capsule = true

[widget.ram]
show_value = false

[widget.spacer_default]
type = "spacer"

[widget.temp]
show_value = false

[widget.volume]
capsule = true

[widget.wallpaper]
capsule = true

[widget.workspaces]
hide_when_empty = true
show_labels = false
capsule = false

[widget.tray]
capsule = true
drawer = true

[widget.taskbar]
group_by_workspace = true
group_single_icon_per_app = true
show_active_indicator = false
capsule = false

[widget.notifications]
capsule = true

[widget.wallpaper_depth]
type = "noctalia/wallpaper_depth:bar"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[plugins]
enabled = [ "noctalia/bitwarden", "noctalia/wallpaper_depth", "noctalia/wallhaven"]

[plugin_settings."noctalia/wallhaven"]
browser_open_near_click = true

[plugin_settings."noctalia/wallpaper_depth"]
manager_open_near_click = true
threshold = 12